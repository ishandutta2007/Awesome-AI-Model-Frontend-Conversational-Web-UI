<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(35px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(35px) rotate(-360deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(420px); }
      }
      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 8s ease-in-out infinite; }
      .pulsing-orb { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .orbiting-dot { animation: orbit 6s linear infinite; transform-origin: 1050px 100px; }
      .stream-line { stroke-dasharray: 20, 10; animation: shimmer 20s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#grid-pattern)" rx="16" />

  <!-- Dynamic Glowing Ambient Orbs (Background) -->
  <circle cx="180" cy="90" r="160" fill="#06b6d4" opacity="0.18" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="180" fill="#8b5cf6" opacity="0.22" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="600" cy="380" r="140" fill="#ec4899" opacity="0.12" class="pulsing-orb" filter="url(#glow)" />

  <!-- Animated Data Connection Streams (Background) -->
  <path d="M -50 320 Q 300 220, 600 320 T 1250 250" fill="none" stroke="url(#accent-cyan-purple)" stroke-width="1.8" opacity="0.35" class="stream-line" />
  <path d="M -50 120 Q 350 260, 750 140 T 1250 180" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.25" class="stream-line" />

  <!-- Floating Dynamic Element 1: Mini Chat UI Card (Left Background Decoration) -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="50" y="240" width="220" height="120" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#subtle-glow)" />
    <!-- Window controls -->
    <circle cx="70" cy="256" r="4" fill="#ef4444" />
    <circle cx="82" cy="256" r="4" fill="#eab308" />
    <circle cx="94" cy="256" r="4" fill="#22c55e" />
    <text x="110" y="259" fill="#94a3b8" font-size="9" font-family="monospace">llm-chat.local:8080</text>
    <!-- Chat bubbles -->
    <rect x="65" y="272" width="130" height="18" rx="6" fill="#334155" opacity="0.8" />
    <rect x="65" y="296" width="180" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
    <text x="73" y="312" fill="#c7d2fe" font-size="10" font-family="monospace">⚡ Model response: 48 tok/s</text>
    <rect x="65" y="328" width="70" height="16" rx="4" fill="#047857" opacity="0.8" />
    <text x="73" y="340" fill="#a7f3d0" font-size="8" font-family="sans-serif">● RAG Online</text>
  </g>

  <!-- Floating Dynamic Element 2: Multi-Model Gateway Card (Right Background Decoration) -->
  <g class="floating-card-2" opacity="0.75">
    <rect x="930" y="60" width="220" height="140" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.2" filter="url(#subtle-glow)" />
    <circle cx="950" cy="78" r="4" fill="#38bdf8" />
    <text x="962" y="82" fill="#38bdf8" font-size="11" font-weight="bold" class="body-text">MCP &amp; Providers</text>
    <line x1="945" y1="94" x2="1135" y2="94" stroke="#334155" stroke-width="1" />
    <!-- Provider Pills -->
    <rect x="948" y="104" width="76" height="18" rx="9" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <text x="958" y="116" fill="#e0f2fe" font-size="9" class="body-text">✦ Ollama</text>
    <rect x="1032" y="104" width="76" height="18" rx="9" fill="#7c3aed" opacity="0.3" stroke="#a78bfa" stroke-width="0.8" />
    <text x="1042" y="116" fill="#ede9fe" font-size="9" class="body-text">✦ Claude</text>
    <rect x="948" y="128" width="76" height="18" rx="9" fill="#16a34a" opacity="0.3" stroke="#4ade80" stroke-width="0.8" />
    <text x="958" y="140" fill="#dcfce7" font-size="9" class="body-text">✦ OpenAI</text>
    <rect x="1032" y="128" width="76" height="18" rx="9" fill="#db2777" opacity="0.3" stroke="#f472b6" stroke-width="0.8" />
    <text x="1042" y="140" fill="#fce7f3" font-size="9" class="body-text">✦ vLLM</text>
    <rect x="948" y="154" width="160" height="18" rx="6" fill="#1e293b" />
    <text x="956" y="166" fill="#10b981" font-size="9" font-family="monospace">● 14 Tools Connected (MCP)</text>
  </g>

  <!-- Center Floating Core Badge -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="url(#accent-cyan-purple)" stroke-width="1.5" filter="url(#subtle-glow)" />
    <text y="4" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2" class="body-text">⚡ CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- FOREGROUND HERO TEXT: Perfectly Centered & High Contrast Foreground -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="155" fill="url(#accent-cyan-purple)" font-size="44" class="title-text" letter-spacing="-0.5" filter="url(#subtle-glow)">
      Awesome AI Model Frontend
    </text>
    <text x="600" y="202" fill="#ffffff" font-size="34" class="title-text" letter-spacing="-0.5">
      &amp; Conversational Web UI
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="245" fill="#94a3b8" font-size="16" font-weight="400" class="body-text">
      The definitive index of self-hosted chat interfaces, local LLM apps, multi-provider workspaces &amp; SaaS frontends
    </text>

    <!-- Interactive Feature Badges in Foreground -->
    <g transform="translate(600, 290)">
      <!-- Badge 1: Self-Hosted WebUI -->
      <g transform="translate(-290, 0)">
        <rect x="0" y="0" width="130" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="70" y="20" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text" text-anchor="middle">Open WebUI</text>
      </g>
      <!-- Badge 2: Multi-Model Agents -->
      <g transform="translate(-145, 0)">
        <rect x="0" y="0" width="135" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="16" cy="16" r="4" fill="#818cf8" />
        <text x="72" y="20" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text" text-anchor="middle">LibreChat &amp; Dify</text>
      </g>
      <!-- Badge 3: Desktop Local LLM -->
      <g transform="translate(8, 0)">
        <rect x="0" y="0" width="130" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <circle cx="16" cy="16" r="4" fill="#c084fc" />
        <text x="70" y="20" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text" text-anchor="middle">Jan &amp; LM Studio</text>
      </g>
      <!-- Badge 4: Artifacts & MCP -->
      <g transform="translate(152, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" />
        <circle cx="16" cy="16" r="4" fill="#f472b6" />
        <text x="75" y="20" fill="#e2e8f0" font-size="11" font-weight="600" class="body-text" text-anchor="middle">Artifacts &amp; MCP</text>
      </g>
    </g>

    <!-- Bottom Feature Highlights -->
    <text x="600" y="365" fill="#64748b" font-size="12" class="body-text">
      🔒 100% Sovereign Privacy  •  ⚡ Ollama &amp; vLLM Acceleration  •  🛠️ Model Context Protocol (MCP)  •  🌐 Multi-User RAG
    </text>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
